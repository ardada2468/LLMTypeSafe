name: Feature request
description: Propose a new capability or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you have in mind. A code sketch helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: dspy
    attributes:
      label: DSPy equivalent
      description: If this exists in Python DSPy, link it.
