version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      # Dev tooling moves together and never reaches a published package.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      # Provider SDKs are peer or runtime dependencies of published packages:
      # one pull request each, so a regression is attributable.
      production:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
