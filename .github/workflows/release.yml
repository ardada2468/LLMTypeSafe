name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Run the full pull-request gate set before anything can be published, so the
  # release path cannot drift from the path changes are reviewed through.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: Version or publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      # Opens a "Version Packages" PR when changesets are pending; publishes to
      # npm when that PR is merged.
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
